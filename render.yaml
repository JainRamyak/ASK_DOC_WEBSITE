services:
  - type: web
    name: askmydocs-api
    runtime: docker
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDER_TYPE
        value: local
      - key: LOCAL_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "512"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: TOP_K_RETRIEVAL
        value: "5"
      - key: LOG_LEVEL
        value: INFO